name: Build Manager APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "android/**"
      - ".github/workflows/build-manager.yml"
  pull_request:
    paths:
      - "android/**"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type (release is R8-shrunk and small; debug is ~10x larger)"
        type: choice
        options: [release, debug]
        default: release

concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to attach the APK to a GitHub release on tags

env:
  # Folder that contains gradlew. Use "src/android" if the project lives there in your repo.
  APP_DIR: android
  ANDROID_PLATFORM: "platforms;android-37.2"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # versionCode is derived from the commit count

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ${{ env.ANDROID_PLATFORM }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts fetches a pinned MIUIX checkout over git; keep it between runs.
      - name: Cache MIUIX checkout
        uses: actions/cache@v4
        with:
          path: ${{ env.APP_DIR }}/.gradle/miuix
          key: miuix-${{ hashFiles(format('{0}/settings.gradle.kts', env.APP_DIR)) }}

      - name: Decide build type
        id: kind
        run: |
          # Release is the default: only release builds are shrunk by R8 (debug APKs are ~10x larger).
          if [[ "${{ inputs.build_type }}" == "debug" ]]; then
            echo "type=debug" >> "$GITHUB_OUTPUT"
          else
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        run: |
          chmod +x gradlew
          TASK=$([ "${{ steps.kind.outputs.type }}" = "release" ] && echo assembleRelease || echo assembleDebug)
          ./gradlew "$TASK" --stacktrace \
            -PnetproxyManagerCi=true \
            -PnetproxyManagerBuildId="${GITHUB_RUN_NUMBER}"

      - name: Unit tests (informational)
        # The sing-box schema/kernel-editor tests target features removed in the Xray port.
        continue-on-error: true
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | sort | head -n 1)
          [ -n "$APK" ] || { echo "No APK produced"; exit 1; }
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      # Release builds are unsigned. Add these repository secrets to sign with your own key:
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Without them a throwaway key is generated so the APK is still installable, but every run gets a
      # different signature, so Android will refuse to update an older install (uninstall it first).
      - name: Sign release APK
        id: sign
        if: steps.kind.outputs.type == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SRC="${{ steps.apk.outputs.path }}"
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          else
            echo "::warning::No signing secrets set - signing with a throwaway CI key"
            KEYSTORE_PASSWORD=android; KEY_ALIAS=ci; KEY_PASSWORD=android
            keytool -genkeypair -keystore "$KS" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=NetProxy CI"
          fi
          export KEYSTORE_PASSWORD KEY_PASSWORD
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          OUT="app/build/outputs/NetProxyManager-${GITHUB_RUN_NUMBER}-signed.apk"
          "$APKSIGNER" sign --ks "$KS" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" \
            --key-pass env:KEY_PASSWORD --out "$OUT" "$SRC"
          "$APKSIGNER" verify "$OUT"
          rm -f "$KS"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "APK size: $(du -h "$OUT" | cut -f1)"

      - name: Final APK path
        id: final
        run: echo "path=${{ steps.sign.outputs.path || steps.apk.outputs.path }}" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetProxyManager-${{ steps.kind.outputs.type }}-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/${{ steps.final.outputs.path }}
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            ${{ env.APP_DIR }}/app/build/reports
            ${{ env.APP_DIR }}/platform/build/reports

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APP_DIR }}/${{ steps.final.outputs.path }}
          generate_release_notes: true
